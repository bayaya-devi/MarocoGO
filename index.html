<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <link rel="manifest" href="/MarocoGO/manifest.webmanifest" />
    <link rel="icon" href="/MarocoGO/logo/marocogo-symbol.png" />
    <meta name="description" content="MarocoGO — découvrez, planifiez et vivez le Maroc à votre rythme." />
    <meta property="og:title" content="MarocoGO" />
    <meta property="og:description" content="Le Maroc, à votre rythme." />
    <title>MarocoGO — Le Maroc, à votre rythme</title>
    <script>
      // Restore the client route redirected by public/404.html on GitHub Pages.
      (() => {
        const { search, pathname, hash } = window.location;
        if (search.startsWith('?/')) {
          const route = search.slice(1).split('&').map((part) => part.replace(/~and~/g, '&')).join('?');
          window.history.replaceState(null, '', `${pathname.slice(0, -1)}${route}${hash}`);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
