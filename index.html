<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07171c" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="description" content="VoyageGo — le monde vous attend. Explorez la planisphère et entrez dans la nouvelle expérience Maroc." />
    <meta property="og:title" content="VoyageGo" />
    <meta property="og:description" content="Le monde vous attend." />
    <title>VoyageGo — Le monde vous attend</title>
    <script>
      // Restore the client route redirected by public/404.html on GitHub Pages.
      (() => {
        const { search, pathname, hash } = window.location;
        if (search.startsWith('?/')) {
          const route = search.slice(1).split('&').map((part) => part.replace(/~and~/g, '&')).join('?');
          window.history.replaceState(null, '', `${pathname.slice(0, -1)}${route}${hash}`);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
